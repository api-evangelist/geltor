aid: geltor
name: Geltor
description: 'Geltor is a biodesign company founded in 2015 by Alex Lorestani and Nick
  Ouzounov that engineers animal-free designer proteins, peptides and polypeptides
  and manufactures them through precision fermentation. Its Biodesigner AI computational
  biology platform is used to imagine, screen and optimize novel protein sequences,
  which are then scaled commercially as ingredients for beauty and personal care, specialty
  nutrition and medical/life-science applications. The portfolio includes HumaColl 21
  (biomimetic human collagen), HumaColl 21 Select (a matrikine peptide complex), Elastapure
  (biomimetic human elastin), Collume and Caviance (vegan collagens) and PrimaColl,
  a Type XXI signaling collagen and the first biotech-derived collagen to receive an
  FDA GRAS "no questions" letter for ingestible use. Geltor sells business-to-business
  to brand formulators and manufacturers; it publishes no public developer API, SDK
  or machine-readable API contract.'
